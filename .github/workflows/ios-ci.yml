name: iOS CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Select simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/^ *(.*) \([0-9A-F-]+\) .*/\1/')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          mkdir -p TestResults
          set -o pipefail
          xcodebuild test \
            -project Teely.xcodeproj \
            -scheme Teely \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath TestResults/Teely.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults
            xcodebuild.log
